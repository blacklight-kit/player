version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore(ci)

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - pnpm
    commit-message:
      prefix: chore(deps)
    versioning-strategy: increase
    groups:
      react:
        patterns:
          - react*
          - '@types/react*'
      eslint:
        patterns:
          - eslint*
          - '@eslint/*'
          - typescript-eslint*
      vite:
        patterns:
          - vite*
          - '@vitejs/*'